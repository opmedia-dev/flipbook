<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issues – flipbook library</title>
  <link rel="stylesheet" href="assets/vendor/page-flip/stPageFlip.css">
  <link rel="stylesheet" href="assets/flipbook.css">
  <script src="assets/vendor/page-flip/page-flip.browser.js"></script>
</head>
<body>
  <main class="wrap">
    <section id="viewer" aria-live="polite">
      <header class="issue-head">
        <p class="issue-kicker" id="kicker">Latest issue</p>
        <h1 class="issue-title" id="title"></h1>
        <p class="issue-date" id="date"></p>
        <button type="button" class="back-latest" id="back" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to latest issue</button>
      </header>
      <div id="book"></div>
    </section>
    <section class="archive" id="archive" hidden>
      <h2 id="archive-heading">Archive</h2>
      <div id="groups"></div>
    </section>
  </main>
  <script type="module">
    import { createFlipbook, loadPdf, renderPageToCanvas } from './assets/flipbook.js';
    import { params, applyTheme, loadIssues, assetUrl, formatDate, viewerUrl, toolsParam, reportHeight, postToParent, showError } from './assets/common.js';
    import { archiveYear, expandArchiveYear } from './assets/archive-years.mjs';

    applyTheme();
    reportHeight();
    if (params.get('archiveTitle')) document.getElementById('archive-heading').textContent = params.get('archiveTitle');

    const host = document.getElementById('book');
    const maxHeight = Number(params.get('maxHeight')) || 760;
    let current = null;
    let issues = [];
    const archiveGroups = new Map();


    async function show(issue, { scroll = false } = {}) {
      current?.destroy();
      current = null;
      const latest = issue === issues[0];
      document.getElementById('kicker').textContent = latest ? (params.get('kicker') || 'Latest issue') : 'From the archive';
      document.getElementById('title').textContent = issue.title;
      document.getElementById('date').textContent = formatDate(issue);
      document.getElementById('back').hidden = latest;
      document.querySelectorAll('.card').forEach((c) => c.setAttribute('aria-current', String(c.dataset.id === issue.id)));
      // Open the year containing the issue currently displayed in the reader.
      expandArchiveYear(archiveGroups, archiveYear(issue));
      if (scroll) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        postToParent({ type: 'scrollToTop' });
      }
      try {
        current = await createFlipbook(host, assetUrl(issue.file), {
          coverUrl: assetUrl(issue.cover),
          downloadName: `${issue.title}.pdf`,
          title: issue.title,
          shareUrl: viewerUrl(issue),
          tools: toolsParam(),
          fullscreenFallbackUrl: viewerUrl(issue),
          maxHeight,
        });
      } catch (e) {
        console.error(e);
        showError(host, 'Sorry, this issue could not be loaded.');
      }
    }

    async function fallbackCover(issue, box) {
      try {
        const pdf = await loadPdf(assetUrl(issue.file));
        box.append(await renderPageToCanvas(pdf, 1, 320));
        pdf.destroy();
      } catch { /* leave grey placeholder */ }
    }

    function buildArchive(list) {
      const groups = document.getElementById('groups');
      const grids = new Map();
      const counts = new Map();
      for (const issue of list) counts.set(archiveYear(issue), (counts.get(archiveYear(issue)) || 0) + 1);
      for (const issue of list) {
        const year = archiveYear(issue);
        let grid = grids.get(year);
        if (!grid) {
          const section = document.createElement('details');
          section.className = 'archive-group';
          section.dataset.year = year;
          const heading = document.createElement('summary');
          heading.className = 'archive-year';
          const name = document.createElement('span');
          name.className = 'archive-year-label';
          name.textContent = year;
          const count = document.createElement('span');
          count.className = 'archive-year-count';
          const n = counts.get(year);
          count.textContent = n + (n === 1 ? ' issue' : ' issues');
          const chevron = document.createElement('span');
          chevron.className = 'archive-year-chevron';
          chevron.setAttribute('aria-hidden', 'true');
          heading.append(name, count, chevron);
          grid = document.createElement('ul');
          grid.className = 'grid';
          section.append(heading, grid);
          heading.addEventListener('click', (event) => {
            // A single open section at a time, including on browsers that do not
            // support <details name="...">. Clicking the open year closes it.
            event.preventDefault();
            expandArchiveYear(archiveGroups, year, { toggle: true });
          });
          grids.set(year, grid);
          archiveGroups.set(year, section);
          groups.append(section);
        }
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'card';
        btn.dataset.id = issue.id;
        const cover = document.createElement('div');
        cover.className = 'card-cover';
        if (issue.cover) {
          const img = document.createElement('img');
          img.src = assetUrl(issue.cover);
          img.alt = '';
          img.loading = 'lazy';
          cover.append(img);
        } else {
          fallbackCover(issue, cover);
        }
        const t = document.createElement('span');
        t.className = 'card-title';
        t.textContent = issue.title;
        const d = document.createElement('span');
        d.className = 'card-date';
        d.textContent = formatDate(issue);
        if (issue === issues[0]) {
          const badge = document.createElement('span');
          badge.className = 'card-badge';
          badge.textContent = 'Latest';
          cover.append(badge);
        }
        btn.append(cover, t, d);
        btn.addEventListener('click', () => show(issue, { scroll: true }));
        li.append(btn);
        grid.append(li);
      }
      document.getElementById('archive').hidden = list.length === 0;
    }

    try {
      issues = await loadIssues();
      if (!issues.length) throw new Error('No issues have been published yet.');
      buildArchive(issues);
      document.getElementById('back').addEventListener('click', () => show(issues[0], { scroll: true }));
      await show(issues[0]);
    } catch (e) {
      console.error(e);
      showError(host, e.message || 'Sorry, the flipbook could not be loaded.');
    }
  </script>
</body>
</html>
