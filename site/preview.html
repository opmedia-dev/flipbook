<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latest issue – flipbook preview</title>
  <link rel="stylesheet" href="assets/vendor/page-flip/stPageFlip.css">
  <link rel="stylesheet" href="assets/flipbook.css">
  <script src="assets/vendor/page-flip/page-flip.browser.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="issue-head" id="head" hidden>
      <p class="issue-kicker" id="kicker">Latest issue</p>
      <h1 class="issue-title" id="title"></h1>
      <p class="issue-date" id="date"></p>
    </header>
    <div id="book"></div>
    <div class="cta" id="cta" hidden><a id="cta-link" target="_top"></a></div>
  </main>
  <script type="module">
    import { createFlipbook } from './assets/flipbook.js';
    import { params, applyTheme, loadIssues, assetUrl, formatDate, viewerUrl, toolsParam, reportHeight, showError } from './assets/common.js';

    applyTheme();
    reportHeight();
    const host = document.getElementById('book');
    const compact = params.get('compact') === '1';
    // Touchscreen phones need a smaller, predictable preview height than the
    // interactive PDF reader can guarantee inside a narrow Duda iframe.
    // Open the full reader in a new tab when the cover is tapped.
    const mobileCover = compact && window.matchMedia('(max-width: 600px) and (pointer: coarse)').matches;
    document.documentElement.classList.toggle('fb-compact', compact);
    document.documentElement.classList.toggle('fb-mobile-cover-only', mobileCover);
    try {
      const issues = await loadIssues();
      const issue = params.get('id') ? issues.find((i) => i.id === params.get('id')) : issues[0];
      if (!issue) throw new Error('No issues have been published yet.');

      if (params.get('title') !== '0') {
        document.getElementById('head').hidden = false;
        if (params.get('kicker')) document.getElementById('kicker').textContent = params.get('kicker');
        const title = document.getElementById('title');
        if (compact) {
          // In narrow Duda homepage columns the toolbar is intentionally
          // compact; the issue title still opens the full interactive reader.
          const full = document.createElement('a');
          full.href = viewerUrl(issue);
          full.target = '_blank';
          full.rel = 'noopener noreferrer';
          full.className = 'fb-compact-full-link';
          full.title = 'Open full magazine with all controls';
          full.textContent = issue.title;
          title.append(full);
        } else {
          title.textContent = issue.title;
        }
        document.getElementById('date').textContent = formatDate(issue);
      }
      const link = params.get('link');
      if (link && /^https?:\/\//i.test(link)) {
        const a = document.getElementById('cta-link');
        a.href = link;
        a.textContent = params.get('linkText') || 'View all issues';
        document.getElementById('cta').hidden = false;
      }
      if (mobileCover) {
        const anchor = document.createElement('a');
        anchor.className = 'fb-mobile-cover-link';
        anchor.href = viewerUrl(issue);
        anchor.target = '_blank';
        anchor.rel = 'noopener noreferrer';
        anchor.setAttribute('aria-label', `Open full ${issue.title} magazine`);
        if (issue.cover) {
          const cover = document.createElement('img');
          cover.src = assetUrl(issue.cover);
          cover.alt = `${issue.title} front cover`;
          cover.loading = 'eager';
          anchor.append(cover);
        } else {
          const placeholder = document.createElement('span');
          placeholder.className = 'fb-mobile-cover-placeholder';
          placeholder.textContent = 'Parish magazine';
          anchor.append(placeholder);
        }
        const action = document.createElement('span');
        action.className = 'fb-mobile-cover-action';
        action.textContent = 'Open full magazine ↗';
        anchor.append(action);
        host.append(anchor);
      } else {
        await createFlipbook(host, assetUrl(issue.file), {
          coverUrl: assetUrl(issue.cover),
          downloadName: `${issue.title}.pdf`,
          title: issue.title,
          shareUrl: viewerUrl(issue),
          tools: compact ? [] : toolsParam(),
          fullscreenFallbackUrl: viewerUrl(issue),
          maxHeight: Number(params.get('maxHeight')) || (compact ? 230 : 520),
          minPageWidth: compact ? 170 : undefined,
        });
      }
    } catch (e) {
      console.error(e);
      showError(host, e.message || 'Sorry, the flipbook could not be loaded.');
    }
  </script>
</body>
</html>
