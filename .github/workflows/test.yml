name: Validate flipbook UI

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run archive and existing UI regression tests
        run: node --test test/*.test.mjs
